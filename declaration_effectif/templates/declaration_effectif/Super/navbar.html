{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'utilisateur/css/N1/navbar.css' %}">
    {% block css %} {% endblock %}
    <title>{% block title %} {% endblock %}</title>
</head>

<body>
    <!-- Main Header + Navbar Container -->
    <header class="app-header shadow-sm">
        <!-- Top Bar (Header Supérieur) -->
        <div class="top-bar d-flex justify-content-between align-items-center">
            <!-- Section Gauche: Logo MODULA sur fond clair -->
            <div class="brand-section d-flex align-items-center px-4 py-3">
                <a class="navbar-brand d-flex align-items-center gap-3 text-decoration-none"
                    href="{% url 'dashboard_N1' %}">
                    <!-- Icone Logo SVG -->
                    <svg width="32" height="32" viewBox="0 0 70 55" fill="none" class="flex-shrink-0">
                        <rect x="0" y="40" width="8" height="8" fill="#0d233a" rx="1" />
                        <rect x="0" y="28" width="8" height="8" fill="#0d233a" rx="1" />
                        <rect x="0" y="16" width="8" height="8" fill="#0056b3" rx="1" />
                        <rect x="0" y="4" width="8" height="8" fill="#0056b3" rx="1" />
                        <rect x="11" y="13" width="7" height="7" fill="#0056b3" opacity="0.85" rx="1" />
                        <rect x="21" y="22" width="6" height="6" fill="#0056b3" opacity="0.7" rx="1" />
                        <rect x="30" y="30" width="7" height="7" fill="#0d233a" rx="1" />
                        <rect x="39" y="22" width="6" height="6" fill="#0056b3" opacity="0.7" rx="1" />
                        <rect x="48" y="13" width="7" height="7" fill="#0056b3" opacity="0.85" rx="1" />
                        <rect x="58" y="4" width="8" height="8" fill="#0056b3" rx="1" />
                        <rect x="58" y="16" width="8" height="8" fill="#0056b3" rx="1" />
                        <rect x="58" y="28" width="8" height="8" fill="#0d233a" rx="1" />
                        <rect x="58" y="40" width="8" height="8" fill="#0d233a" rx="1" />
                    </svg>
                    <div class="d-flex flex-column lh-1">
                        <span class="brand-title fw-bold fs-4">MODULA</span>
                        <span class="brand-subtitle fw-semibold">EFFECTIF MANAGEMENT</span>
                    </div>
                </a>
            </div>

            <!-- Section Droite: Alertes + Profil Utilisateur -->
            <div class="user-section d-flex align-items-center gap-3 px-4 py-2">
                <!-- Profil Utilisateur -->
                <div class="user-card d-flex align-items-center gap-3 bg-white px-3 py-2 rounded-3 shadow-sm">
                    <!-- Avatar avec Initiales -->
                    <div class="avatar-circle">
                        NY
                    </div>

                    <!-- Info Utilisateur + Role Dropdown -->
                    <div class="user-details text-start">
                        <div class="dropdown role-switcher">
                            <button
                                class="btn btn-link dropdown-toggle text-dark fw-bold p-0 text-decoration-none shadow-none d-flex align-items-center gap-2"
                                type="button" id="userRoleDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="user-name">{{ request.session.nom|default:"Nadi Yassine" }}</span>
                            </button>
                        </div>
                        <small class="user-role text-muted d-block">{{ request.session.role|default:"N+1" }}</small>
                    </div>

                    <!-- Bouton Déconnexion -->
                    <a href="{% url 'deconnecter' %}"
                        class="btn btn-outline-custom-logout btn-sm d-flex align-items-center gap-1 ms-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnecter</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Navigation Bar (Deuxième niveau avec Onglets) -->
        <nav class="sub-navbar border-top">
            <div class="container-fluid px-4">
                <ul class="nav nav-tabs border-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'Admin' %}active{% endif %}"
                            href="{% url 'Admin' %}">
                            <i class="fas fa-users me-2"></i>Liste Utilisateurs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'importer_fichier' %}active{% endif %}"
                            href="{% url 'importer_fichier' %}">
                            <i class="fas fa-file-import me-2"></i></i>Importer Fichiers
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <!-- Main Content -->
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS (bundle avec Popper) : chargé UNE SEULE FOIS ici, pour toute page qui étend navbar.html -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block script %}{% endblock %}
</body>

</html>
